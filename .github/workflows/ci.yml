name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.5", "24.22.3", "26.13.1"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-go@v7
        if: matrix.node == '24.22.3'
        with:
          go-version: "1.27.4"
          cache-dependency-path: test/go/go.sum
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - if: matrix.node == '24.22.3'
        run: |
          bun fmt --check src test package.json tsconfig.json tsconfig.build.json .github/workflows
          bun check
          bun test --coverage
          bun audit
          bun run test:go
      - run: bun run build
      - run: bun run test:package "$RUNNER_TEMP/tlock-js.tgz"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && matrix.node == '24.22.3'
        with:
          name: npm-package
          path: ${{ runner.temp }}/tlock-js.tgz
          if-no-files-found: error
          retention-days: 3
